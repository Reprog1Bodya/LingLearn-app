# Запуск всего бэкенда одной командой:  cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linglearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: linglearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linglearn -d linglearn"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://linglearn:${POSTGRES_PASSWORD}@db:5432/linglearn
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      AUTO_MIGRATE: "true"
      SEED_ON_STARTUP: "true"
      WRITE_CLIENT_CONFIG: "false"
    ports:
      - "8080:8080"

volumes:
  pgdata:
